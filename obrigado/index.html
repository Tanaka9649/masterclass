<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#080808">
  <title>Obrigado | Masterclass Black Friday — DM Empresarial</title>
  <meta name="description" content="Obrigado! Você será redirecionado para o grupo oficial da Masterclass Black Friday.">
  <noscript><meta http-equiv="refresh" content="2;url=https://chat.whatsapp.com/IXLMlb3p11Z7SLOxzV9YOv"></noscript>
  <style>
    :root{color-scheme:dark;--bg:#080808;--fg:#f7f7f7;--muted:#b8b8b8;--red:#e32635}
    *,*::before,*::after{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--fg);display:grid;place-items:center;padding:28px}
    main{max-width:680px;width:100%;text-align:center}
    .brand{font-weight:800;letter-spacing:.15em;font-size:.76rem;text-transform:uppercase;color:var(--muted)}
    .mark{height:3px;width:46px;background:var(--red);margin:0 auto 28px}
    h1{font-size:clamp(2.35rem,7vw,4.5rem);line-height:1.05;letter-spacing:-.03em;margin:0 0 22px;font-weight:800}
    h1 span{color:var(--red)}
    p{font-size:clamp(1rem,2.5vw,1.2rem);line-height:1.6;color:var(--muted);max-width:510px;margin:0 auto 18px}
    .progress{height:3px;width:min(280px,80%);background:#2a2a2a;margin:32px auto 36px;overflow:hidden;border-radius:10px}
    .progress::after{content:"";display:block;width:100%;height:100%;background:var(--red);transform-origin:left;animation:fill 2s linear forwards}
    .btn{display:inline-block;background:var(--red);padding:15px 22px;border-radius:5px;color:#fff;text-decoration:none;font-weight:750;transition:background .15s}
    .btn:hover{background:#bf1d2c}
    .hint{font-size:.8rem;color:#9a9a9a;margin-top:19px}
    @keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @media(prefers-reduced-motion:reduce){.progress::after{animation:none;transform:scaleX(1)}.btn{transition:none}}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <div class="brand">Masterclass Black Friday · DM Empresarial</div>
    <h1>Obrigado<span>!</span></h1>
    <p>Você será redirecionado para o nosso grupo do WhatsApp.</p>
    <div class="progress" aria-hidden="true"></div>
    <a class="btn" href="https://chat.whatsapp.com/IXLMlb3p11Z7SLOxzV9YOv" rel="noopener noreferrer">Entrar no grupo agora</a>
    <p class="hint">Se o redirecionamento não acontecer automaticamente, utilize o botão acima.</p>
  </main>
  <script>
    window.setTimeout(function(){window.location.replace('https://chat.whatsapp.com/IXLMlb3p11Z7SLOxzV9YOv')},2000);
  </script>
</body>
</html>
